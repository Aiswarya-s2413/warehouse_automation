version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.env
    ports:
      - "5432:5432" # For local debugging, can be removed in production

  redis:
    image: redis:7-alpine

  web:
    build: .
    command: gunicorn warehouse_automation.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    # The web service will be accessed via nginx, so no need to expose port 8000
    # ports:
    #   - "8000:8000"
    env_file:
      - ./.env
    depends_on:
      - db
      - redis

  worker:
    build: .
    # Command to start the Celery worker
    command: celery -A warehouse_automation worker -l info
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  postgres_data: